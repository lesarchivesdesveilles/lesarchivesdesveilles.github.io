name: Mettre a jour le sitemap

on:
  push:
    branches: [main]
    paths:
      - 'archives.json'
      - 'scripts/generate_sitemap.py'
      - '.github/workflows/update-sitemap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generer sitemap.xml
        run: python3 scripts/generate_sitemap.py
      - name: Publier si le sitemap a change
        run: |
          if ! git diff --quiet -- sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "Mise a jour automatique du sitemap"
            git push
          else
            echo "Sitemap deja a jour"
          fi
