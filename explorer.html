<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explorer les archives — Les Archives des Veilles</title>
  <style>
    :root {
      --fond: #171119;
      --carte: #30222e;
      --or: #e8bb7e;
      --texte: #f5e5cb;
      --discret: #b59b86;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--fond); color: var(--texte); font: 16px/1.6 Arial, sans-serif; }
    header, main, footer { max-width: 900px; margin: auto; padding: 25px 20px; }
    header { text-align: center; border-bottom: 1px solid #70533e; }
    h1, h2 { font-family: Georgia, serif; font-weight: normal; }
    h1 { color: var(--or); }
    a { color: inherit; }
    .retour { color: var(--or); text-decoration: none; }
    .onglets { display: flex; gap: 10px; margin: 22px 0; }
    .onglets button {
      flex: 1; background: var(--carte); color: var(--texte);
      border: 1px solid #70533e; border-radius: 9px; padding: 12px;
      cursor: pointer; font-size: 15px;
    }
    .onglets button[aria-selected="true"] { background: var(--or); color: var(--fond); font-weight: bold; }
    .recherche {
      width: 100%; padding: 14px; background: #241a25;
      border: 1px solid #70533e; border-radius: 9px;
      color: var(--texte); font-size: 16px;
    }
    .ligne {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 12px; text-decoration: none;
      border-bottom: 1px solid #493349;
    }
    .ligne:hover, .theme:hover { background: #3b2a3b; }
    .ligne:focus-visible, .theme:focus-visible, button:focus-visible, .recherche:focus-visible {
      outline: 2px solid var(--or); outline-offset: 2px;
    }
    .num { color: var(--or); font-size: 12px; min-width: 58px; font-variant-numeric: tabular-nums; }
    .titre { flex: 1; min-width: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
    .fleche { color: var(--or); }
    .theme {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; width: 100%; padding: 15px; text-align: left;
      background: var(--carte); color: var(--texte);
      border: 1px solid #70533e; border-radius: 9px;
      margin: 9px 0; cursor: pointer; font-size: 15px;
    }
    .compteur, .aide { color: var(--discret); font-size: 13px; }
    .compteur { white-space: nowrap; }
    .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 15px 0; }
    .actions button {
      background: transparent; border: 1px solid #70533e;
      color: var(--or); padding: 9px; border-radius: 7px; cursor: pointer;
    }
    .pagination { display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:8px; margin:35px auto 0; }
    .pagination button { min-width:42px; min-height:42px; padding:9px 12px; background:#30222e; color:var(--texte); border:1px solid #70533e; border-radius:8px; font-size:15px; cursor:pointer; }
    .pagination button:hover:not(:disabled) { background:#463044; border-color:var(--or); }
    .pagination button.actif { background:var(--or); color:var(--fond); border-color:var(--or); font-weight:bold; }
    .pagination button:disabled { opacity:.35; cursor:default; }
    .pagination .points { padding:0 4px; color:var(--discret); }
    .cache { display: none !important; }
    footer { text-align: center; color: var(--discret); font-size: 12px; border-top: 1px solid #70533e; }
    @media (max-width: 550px) {
      .ligne { gap: 8px; padding: 11px 7px; }
      .num { min-width: 48px; font-size: 11px; }
      .titre { font-size: 13px; }
      .onglets button { font-size: 13px; }
      .theme { font-size: 14px; }
      .pagination { gap:5px; }
      .pagination button { min-width:38px; padding:8px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="retour" id="retour-bibliotheque" href="index.html">← Retour à la bibliothèque</a>
    <h1>Explorer les archives</h1>
    <p class="aide">Retrouvez toutes les explorations par numéro ou par thématique.</p>
  </header>

  <main>
    <div class="onglets" role="tablist" aria-label="Mode d’exploration">
      <button id="tab-titres" type="button" role="tab" aria-selected="true">Toutes les archives</button>
      <button id="tab-themes" type="button" role="tab" aria-selected="false">Par thématique</button>
    </div>
    <input class="recherche" type="search" id="recherche"
           placeholder="Rechercher un titre ou un numéro…" aria-label="Rechercher une archive">
    <div class="actions">
      <span id="indication" class="aide"></span>
      <button type="button" id="retour-themes" class="cache">← Toutes les thématiques</button>
    </div>
    <section id="resultats" aria-live="polite"></section>
    <nav class="pagination" id="pagination" aria-label="Pages des archives"></nav>
  </main>

  <footer>© 2026 Les Archives des Veilles</footer>

  <script>
    const resultats = document.getElementById('resultats');
    const recherche = document.getElementById('recherche');
    const indication = document.getElementById('indication');
    const retourThemes = document.getElementById('retour-themes');
    const retourBibliotheque = document.getElementById('retour-bibliotheque');
    const pagination = document.getElementById('pagination');
    const PAR_PAGE = 24;

    // Retour à la page précédente du site, sans envoyer vers un site externe.
    // En accès direct ou depuis un autre site, retour classique à l'accueil.
    retourBibliotheque.addEventListener('click', (evenement) => {
      let precedentInterne = false;
      try {
        const precedente = new URL(document.referrer);
        precedentInterne = precedente.origin === location.origin &&
          precedente.pathname !== location.pathname;
      } catch (_) {
        // Aucun référent exploitable : le lien index.html reste fonctionnel.
      }
      if (precedentInterne && history.length > 1) {
        evenement.preventDefault();
        history.back();
      }
    });

    let archives = [];
    let themes = [];
    let vue = new URLSearchParams(location.search).get('vue') === 'themes' ? 'themes' : 'titres';
    let themeActif = vue === 'themes' ? new URLSearchParams(location.search).get('theme') : null;
    recherche.value = new URLSearchParams(location.search).get('q') || '';
    let pageActuelle = Math.max(1, Number.parseInt(new URLSearchParams(location.search).get('page'), 10) || 1);

    function memoriserNavigation() {
      const url = new URL(location.href);
      url.searchParams.set('vue', vue);
      if (vue === 'themes' && themeActif) url.searchParams.set('theme', themeActif);
      else url.searchParams.delete('theme');
      if (pageActuelle > 1) url.searchParams.set('page', String(pageActuelle));
      else url.searchParams.delete('page');
      if (recherche.value.trim()) url.searchParams.set('q', recherche.value.trim());
      else url.searchParams.delete('q');
      history.replaceState(null, '', url);
    }

    const normaliser = s => String(s || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLocaleLowerCase('fr');

    // Ordre numérique croissant dans les deux onglets.
    const ordre = (a, b) => Number(a.numero) - Number(b.numero);

    function lienArchive(a) {
      const lien = document.createElement('a');
      lien.className = 'ligne';
      const retour = location.pathname + location.search;
      lien.href = `archive.html?archive=${encodeURIComponent(a.numero)}&retour=${encodeURIComponent(retour)}`;

      const numero = document.createElement('span');
      numero.className = 'num';
      numero.textContent = `n° ${a.numero}`;

      const titre = document.createElement('span');
      titre.className = 'titre';
      const titrePrincipal = String(a.titre || `Archive ${a.numero}`).trim();
      const sousTitre = String(a.sousTitre || '').trim();
      // Minuscule initiale après « : », sauf sigles et noms propres connus.
      const exceptions = /^(?:IA|ADN|OVNI|USA|NASA|ONU)\b/;
      const sousTitreAffiche = exceptions.test(sousTitre)
        ? sousTitre
        : sousTitre.replace(/^(\p{L})/u, lettre => lettre.toLocaleLowerCase('fr'));
      titre.textContent = sousTitre ? `${titrePrincipal} : ${sousTitreAffiche}` : titrePrincipal;

      const fleche = document.createElement('span');
      fleche.className = 'fleche';
      fleche.textContent = '›';

      lien.append(numero, titre, fleche);
      return lien;
    }

    function changerVue(v) {
      vue = v;
      themeActif = null;
      pageActuelle = 1;
      memoriserNavigation();
      afficher();
    }

    function afficherPagination(nombrePages) {
      pagination.replaceChildren();
      if (nombrePages <= 1) return;
      function ajouterBouton(texte, page, actif = false, desactive = false, description = '') {
        const bouton = document.createElement('button');
        bouton.type = 'button';
        bouton.textContent = texte;
        bouton.disabled = desactive;
        if (description) { bouton.setAttribute('aria-label', description); bouton.title = description; }
        if (actif) { bouton.classList.add('actif'); bouton.setAttribute('aria-current', 'page'); }
        bouton.onclick = () => {
          pageActuelle = page;
          memoriserNavigation();
          afficher();
          document.querySelector('.actions').scrollIntoView({block:'start', behavior:'instant'});
        };
        pagination.appendChild(bouton);
      }
      function ajouterPoints() {
        const points = document.createElement('span');
        points.className = 'points';
        points.textContent = '…';
        points.setAttribute('aria-hidden', 'true');
        pagination.appendChild(points);
      }
      ajouterBouton('«', 1, false, pageActuelle === 1, 'Première page');
      ajouterBouton('‹', pageActuelle - 1, false, pageActuelle === 1, 'Page précédente');
      const pages = new Set([1, nombrePages]);
      for (let p = pageActuelle - 1; p <= pageActuelle + 1; p++) {
        if (p >= 1 && p <= nombrePages) pages.add(p);
      }
      let precedente = 0;
      for (const page of [...pages].sort((a,b)=>a-b)) {
        if (precedente && page - precedente === 2) ajouterBouton(String(precedente + 1), precedente + 1);
        else if (precedente && page - precedente > 2) ajouterPoints();
        ajouterBouton(String(page), page, page === pageActuelle);
        precedente = page;
      }
      ajouterBouton('›', pageActuelle + 1, false, pageActuelle === nombrePages, 'Page suivante');
      ajouterBouton('»', nombrePages, false, pageActuelle === nombrePages, 'Dernière page');
    }

    function afficher() {
      resultats.replaceChildren();
      pagination.replaceChildren();
      const q = normaliser(recherche.value.trim());
      document.getElementById('tab-titres').setAttribute('aria-selected', String(vue === 'titres'));
      document.getElementById('tab-themes').setAttribute('aria-selected', String(vue === 'themes'));
      retourThemes.classList.toggle('cache', vue !== 'themes' || !themeActif);

      const trouves = archives.filter(a => normaliser(
        `${a.titre || ''} ${a.numero || ''} ${a.sousTitre || ''}`
      ).includes(q));

      if (vue === 'titres' || themeActif) {
        const liste = trouves
          .filter(a => vue === 'titres' || a.thematique === themeActif)
          .sort(ordre);
        const nomTheme = themeActif ? themes.find(t => t.id === themeActif)?.nom : '';
        indication.textContent = `${nomTheme ? nomTheme + ' · ' : ''}${liste.length} archive(s)`;
        const nombrePages = Math.max(1, Math.ceil(liste.length / PAR_PAGE));
        if (pageActuelle > nombrePages) { pageActuelle = nombrePages; memoriserNavigation(); }
        for (const a of liste.slice((pageActuelle - 1) * PAR_PAGE, pageActuelle * PAR_PAGE)) {
          resultats.append(lienArchive(a));
        }
        afficherPagination(nombrePages);
        if (!liste.length) resultats.textContent = 'Aucune archive trouvée.';
        return;
      }

      indication.textContent = 'Choisissez une thématique';
      for (const t of themes) {
        const total = trouves.filter(a => a.thematique === t.id).length;
        const bouton = document.createElement('button');
        bouton.type = 'button';
        bouton.className = 'theme';

        const nom = document.createElement('span');
        nom.textContent = t.nom;
        const nombre = document.createElement('span');
        nombre.className = 'compteur';
        nombre.textContent = `${total} archive(s) ›`;

        bouton.append(nom, nombre);
        bouton.onclick = () => { themeActif = t.id; pageActuelle = 1; memoriserNavigation(); afficher(); };
        resultats.append(bouton);
      }

      const sans = trouves.filter(a => !a.thematique).length;
      if (sans) {
        const info = document.createElement('p');
        info.className = 'aide';
        info.textContent = `${sans} archive(s) restent à classer.`;
        resultats.append(info);
      }
    }

    document.getElementById('tab-titres').onclick = () => changerVue('titres');
    document.getElementById('tab-themes').onclick = () => changerVue('themes');
    retourThemes.onclick = () => { themeActif = null; pageActuelle = 1; memoriserNavigation(); afficher(); };
    recherche.oninput = () => { pageActuelle = 1; memoriserNavigation(); afficher(); };
    window.addEventListener('popstate', () => {
      const params = new URLSearchParams(location.search);
      vue = params.get('vue') === 'themes' ? 'themes' : 'titres';
      themeActif = vue === 'themes' ? params.get('theme') : null;
      recherche.value = params.get('q') || '';
      pageActuelle = Math.max(1, Number.parseInt(params.get('page'), 10) || 1);
      afficher();
    });

    Promise.all([
      fetch('index-archives.json').then(r => {
        if (!r.ok) throw Error('index');
        return r.json();
      }),
      fetch('thematiques.json').then(r => {
        if (!r.ok) throw Error('thématiques');
        return r.json();
      })
    ]).then(([data, cats]) => {
      archives = Object.values(data);
      themes = cats;
      if (themeActif && !themes.some(t => t.id === themeActif)) themeActif = null;
      afficher();
    }).catch(e => {
      console.error(e);
      resultats.textContent = 'Impossible de charger les archives pour le moment.';
    });
  </script>
</body>
</html>
