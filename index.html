<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="Les Archives des Veilles — Bibliothèque">
  <meta property="og:description" content="Une bibliothèque d'explorations et d'infographies documentaires.">
  <meta property="og:url" content="https://lesarchivesdesveilles.github.io/">
  <meta property="og:image" content="https://lesarchivesdesveilles.github.io/partage.webp">

  <title>Les Archives des Veilles — Bibliothèque</title>

  <meta property="og:type" content="website">

  <style>
    :root {
      --fond: #171119;
      --carte: #30222e;
      --or: #e8bb7e;
      --texte: #f5e5cb;
      --discret: #b59b86;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--fond);
      color: var(--texte);
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    .bandeau-accueil {
      width: 100%;
      height: clamp(320px, 38vw, 450px);
    
      background-image:
      linear-gradient(
        to bottom,
        transparent 65%,
        #171119 100%
      ),
      url("bandeaux/accueil.webp");

    background-position: center 35%;
    background-size: cover;
    background-repeat: no-repeat;
  }

    header {
      padding: 25px 20px 45px;
      text-align: center;
      border-bottom: 1px solid #70533e;
    }
    
    .couverture {
      height: 180px;
      background: linear-gradient(135deg, #382435, #70533e);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--or);
      font-family: Georgia, serif;
      font-size: 40px;
    }
    .signature {
      color: var(--or);
      letter-spacing: 3px;
      font-size: 13px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: clamp(32px, 5vw, 48px);
      font-weight: normal;
      margin: 20px 0;
    }

   h3 {
      font-family: Georgia, serif;
      font-size: 17px;
      font-weight: normal;
      line-height: 1.35;
      margin: 10px 0;
    }
    
    .introduction {
      max-width: 680px;
      font-size: 14px;
      margin: auto;
      color: var(--discret);
    }

    main {
      max-width: 1150px;
      margin: auto;
      padding: 25px 20px 45px;
    }

    h2 {
      font-family: Georgia, serif;
      color: var(--or);
      font-weight: normal;
    }

    .recherche {
      width: 100%;
      padding: 15px;
      margin: 8px 0 30px;
      background: #241a25;
      border: 1px solid #70533e;
      border-radius: 9px;
      color: var(--texte);
      font-size: 16px;
    }

    .galerie {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 24px;
    }

    .archive {
      background: var(--carte);
      border: 1px solid #70533e;
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: var(--texte);
      transition: transform .2s, border-color .2s;
    }

    .archive[hidden] {
      display: none;
    }

    .archive:hover {
      transform: translateY(-5px);
      border-color: var(--or);
    }
    
    .numero {
      color: var(--or);
      font-size: 12px;
      letter-spacing: 2px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: var(--discret);
      font-size: 12px;
      border-top: 1px solid #70533e;
    }

    .couverture img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    
    .contenu {
      padding: 12px 15px;
    }

    /* Ajustements pour les téléphones */
    @media (max-width: 600px) {
    
      .bandeau-accueil {
        height: 175px;
        background-position: center 28%;
      }
    
      header {
        padding: 18px 20px 25px;
      }
    
      main {
        padding: 12px 20px 35px;
      }
    
      .introduction {
        font-size: 12px;
        line-height: 1.5;
      }

      h1 {
        margin: 14px 0 18px;
        line-height: 1.2;
      }
      
      .titre-principal,
      .titre-secondaire {
        display: block;
      }
      
      .titre-principal {
        font-size: 36px;
      }
      
      .titre-secondaire {
        font-size: 23px;
        margin-top: 5px;
      }
    }
    
  </style>
</head>

<body>
  
    <div class="bandeau-accueil" role="img"
       aria-label="Œil doré entouré d'archives anciennes"></div>
  
    <header>
    <div class="signature">✦ LES ARCHIVES DES VEILLES ✦</div>
    <h1>
      <span class="titre-principal">Bibliothèque</span>
      <span class="titre-secondaire">des explorations</span>
    </h1>
    <p class="introduction">
      Infographies issues de séances d'hypnose,<br>
      illustrant les perceptions, récits et hypothèses explorés.
    </p>

    <nav class="liens-sociaux" aria-label="Réseaux sociaux">
      <span>Retrouvez les explorations sur</span>
      <div>
        <a href="URL_FACEBOOK">Facebook</a>
        <span>·</span>
        <a href="URL_INSTAGRAM">Instagram</a>
        <span>·</span>
        <a href="URL_YOUTUBE">YouTube</a>
        <span>·</span>
        <a href="URL_TIKTOK">TikTok</a>
      </div>
    </nav>
      
  </header>

  <main>
    <h2>Explorer les archives</h2>

    <input
      class="recherche"
      id="recherche"
      type="search"
      placeholder="Rechercher un titre ou un numéro d'archive…"
      aria-label="Rechercher une archive"
    >

    <section class="galerie" id="galerie">
    </section>
    
  </main>

  <footer>
    © 2026 Les Archives des Veilles
  </footer>

  <script>
   
  const recherche = document.getElementById("recherche");
  const galerie = document.getElementById("galerie");
  
  let cartes = [];
  
  async function chargerArchives() {
    try {
      const reponse = await fetch("archives.json");
  
      if (!reponse.ok) {
        throw new Error("Impossible de charger archives.json");
      }
  
      const archives = await reponse.json();
  
      // Archives les plus récentes en premier
      const liste = Object.entries(archives)
        .sort(([a], [b]) => Number(b) - Number(a));
  
      galerie.replaceChildren();
  
      for (const [numero, archive] of liste) {
        const lien = document.createElement("a");
        lien.className = "archive";
        lien.href =
          `archive.html?archive=${encodeURIComponent(numero)}`;
  
        const couverture = document.createElement("div");
        couverture.className = "couverture";
  
        const image = document.createElement("img");
        image.src = archive.miniature ||
          `miniatures/${numero}.webp`;
        image.alt = `Couverture de l'archive ${numero}`;
        image.loading = "lazy";
        image.decoding = "async";
  
        couverture.appendChild(image);
  
        const contenu = document.createElement("div");
        contenu.className = "contenu";
  
        const etiquette = document.createElement("span");
        etiquette.className = "numero";
        etiquette.textContent = `ARCHIVE n° ${numero}`;
  
        const titre = document.createElement("h3");
        const titreComplet = [
          archive.titre,
          archive.sousTitre
        ].filter(Boolean).join(" : ");
        
        titre.textContent = titreComplet || `Archive ${numero}`;
  
        contenu.append(etiquette, titre);
        lien.append(couverture, contenu);
        galerie.appendChild(lien);
      }
  
      // Mémoriser les cartes générées
      cartes = Array.from(galerie.querySelectorAll(".archive"));
  
      // Appliquer une recherche déjà saisie
      filtrerArchives();
  
    } catch (erreur) {
      console.error(erreur);
      galerie.textContent =
        "Impossible de charger les archives pour le moment.";
    }
  }
  
  function filtrerArchives() {
    const texte = recherche.value
      .trim()
      .toLocaleLowerCase("fr");
  
    cartes.forEach(carte => {
      const correspond = carte.textContent
        .toLocaleLowerCase("fr")
        .includes(texte);
  
      carte.hidden = !correspond;
    });
  }
  
  recherche.addEventListener("input", filtrerArchives);
  
  chargerArchives();

  </script>

</body>
</html>
